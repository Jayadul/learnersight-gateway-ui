server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # media uploads go through /api/media (nginx default is 1m, too small)
  client_max_body_size 30m;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # public media files served by the API — Media Library links share the web domain
  location /media/ {
    proxy_pass http://api:8080/media/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # gateway endpoint lives at the API root (not under /api/) — needed by the SendText simulator page
  location = /sendtext {
    proxy_pass http://api:8080/sendtext;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
