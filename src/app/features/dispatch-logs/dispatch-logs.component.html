<div class="nzg-page">
  <app-page-header title="Dispatch Logs" [breadcrumbs]="[{ label: 'Monitoring' }, { label: 'Dispatch Logs' }]" />

  <app-filter-bar [controls]="filters" (search)="state.setFilters($event)" (reset)="state.setFilters({})" />

  <app-data-table
    [columns]="columns"
    [data]="state.data()"
    [totalCount]="state.totalCount()"
    [loading]="state.loading()"
    [pageIndex]="state.pageIndex()"
    [pageSize]="state.pageSize()"
    emptyIcon="send"
    emptyTitle="No dispatch jobs"
    emptySubtitle="No jobs have been dispatched yet."
    (pageChange)="state.setPage($event)"
    (sortChange)="state.setSort($event)">
    <ng-template appColumnDef="isFallback" let-row>
      @if (row.isFallback) {
        <mat-chip class="fallback-chip" [disableRipple]="true">FALLBACK</mat-chip>
      } @else { — }
    </ng-template>
  </app-data-table>
</div>
