<h2 mat-dialog-title>{{ isEdit ? 'Edit' : 'Add' }} User</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="nzg-form">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" />
      <app-form-field-errors [control]="form.controls.username" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" />
      <app-form-field-errors [control]="form.controls.email" />
    </mat-form-field>

    @if (!isEdit) {
      <mat-form-field appearance="outline" class="full">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" />
        <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())">
          <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <app-form-field-errors [control]="form.controls.password" />
      </mat-form-field>
    } @else {
      <mat-form-field appearance="outline" class="full">
        <mat-label>New Password (leave blank to keep current)</mat-label>
        <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="newPassword" />
        <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())">
          <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </mat-form-field>
    }

    <mat-form-field appearance="outline" class="full">
      <mat-label>Role</mat-label>
      <mat-select formControlName="role">
        @for (r of roles; track r.value) { <mat-option [value]="r.value">{{ r.label }}</mat-option> }
      </mat-select>
    </mat-form-field>

    @if (isEdit) {
      <mat-slide-toggle formControlName="isActive">Active</mat-slide-toggle>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
