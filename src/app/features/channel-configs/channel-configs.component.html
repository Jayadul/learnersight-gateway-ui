<div class="nzg-page">
  <app-page-header title="Channels" subtitle="Connect and manage your SMS, WhatsApp, and voice providers" />

  <mat-tab-group [selectedIndex]="activeTab()" (selectedIndexChange)="onTabChange($event)">
    @for (tab of tabs; track tab.channelType) {
      <mat-tab [label]="tab.label"></mat-tab>
    }
  </mat-tab-group>

  <div class="tab-body">
    <app-loading-spinner [loading]="loading()" />

    @if (!loading()) {
      @if (configs().length === 0) {
        <app-empty-state icon="settings_input_antenna" title="This channel isn't set up yet"
                         subtitle="Use the + button below to add one." />
      } @else {
        <div class="cards-grid">
          @for (config of configs(); track config.id) {
            <app-config-card [config]="config" [balance]="balances()[config.id] ?? null"
                             (edit)="onEdit($event)" (activate)="onActivate($event)"
                             (deactivate)="onDeactivate($event)" (setDefault)="onSetDefault($event)"
                             (delete)="onDelete($event)" />
          }
        </div>
      }
    }
  </div>

  <button mat-fab color="primary" class="fab" (click)="openCreate()" matTooltip="Add channel">
    <mat-icon>add</mat-icon>
  </button>
</div>
