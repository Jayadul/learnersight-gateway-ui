<h2 mat-dialog-title>API Log Detail</h2>
<mat-dialog-content>
  <div class="meta">
    <span>Status: <b>{{ log.responseStatus }}</b></span>
    <span>Duration: <b>{{ log.durationMs }} ms</b></span>
    <span>IP: <b>{{ log.callerIp }}</b></span>
    <span>Time: <b>{{ log.requestedAt | date: 'medium' }}</b></span>
  </div>
  <div class="panes">
    <div class="pane">
      <h4>Request Body</h4>
      <pre>{{ pretty(log.rawBody) }}</pre>
    </div>
    <div class="pane">
      <h4>Response Body</h4>
      <pre>{{ pretty(log.responseBody) }}</pre>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
