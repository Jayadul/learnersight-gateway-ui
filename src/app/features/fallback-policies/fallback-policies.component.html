<div class="nzg-page">
  <app-page-header title="Fallback Rules" subtitle="Automatically resend failed messages through another channel">
    <button mat-flat-button color="primary" (click)="openCreate()"><mat-icon>add</mat-icon> Add Rule</button>
  </app-page-header>

  <app-data-table
    [columns]="columns"
    [data]="policies()"
    [loading]="loading()"
    [serverSide]="false"
    [rowActions]="rowActions"
    emptyIcon="alt_route"
    emptyTitle="No fallback rules yet"
    (actionClick)="onAction($event)" />
</div>
