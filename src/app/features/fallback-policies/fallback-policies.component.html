<div class="nzg-page">
  <app-page-header title="Fallback Policies" [breadcrumbs]="[{ label: 'Configuration' }, { label: 'Fallback Policies' }]">
    <button mat-flat-button color="primary" (click)="openCreate()"><mat-icon>add</mat-icon> Add Policy</button>
  </app-page-header>

  <app-data-table
    [columns]="columns"
    [data]="policies()"
    [loading]="loading()"
    [serverSide]="false"
    [rowActions]="rowActions"
    emptyIcon="alt_route"
    emptyTitle="No fallback policies"
    (actionClick)="onAction($event)">
    <ng-template appColumnDef="isGlobal" let-row>
      @if (row.isGlobal) {
        <mat-chip class="global-chip" [disableRipple]="true">GLOBAL</mat-chip>
      } @else { — }
    </ng-template>
    <ng-template appColumnDef="isActive" let-row>
      <mat-slide-toggle [checked]="row.isActive" (change)="toggleActive(row)"></mat-slide-toggle>
    </ng-template>
  </app-data-table>
</div>
