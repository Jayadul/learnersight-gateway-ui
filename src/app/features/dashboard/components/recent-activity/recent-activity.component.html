<mat-card class="activity-card">
  <h3>Recent Activity <span class="scope-badge">Latest 10</span></h3>
  @if (items().length === 0) {
    <p class="empty">No recent messages.</p>
  } @else {
    <mat-list>
      @for (item of items(); track item.id) {
        <mat-list-item class="activity-row">
          <div class="row-content">
            <div class="left">
              <span class="phone">{{ item.recipient }}</span>
              <span class="time">{{ (item.sentAt ?? item.createdAt) | date: 'short' }}</span>
            </div>
            <div class="middle">
              <mat-chip-set>
                <mat-chip [disableRipple]="true">{{ item.channelLabel ?? (item.channelType | channelType) }}</mat-chip>
              </mat-chip-set>
            </div>
            <app-status-badge [status]="item.deliveryStatus" type="delivery" />
          </div>
        </mat-list-item>
      }
    </mat-list>
  }
</mat-card>
