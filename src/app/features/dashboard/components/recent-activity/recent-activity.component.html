<mat-card class="activity-card">
  <h3>Recent Activity</h3>
  @if (items().length === 0) {
    <p class="empty">No recent requests.</p>
  } @else {
    <mat-list>
      @for (item of items(); track item.id) {
        <mat-list-item class="activity-row">
          <div class="row-content">
            <div class="left">
              <span class="phone">{{ item.toUser }}</span>
              <span class="time">{{ item.receivedAt | date: 'short' }}</span>
            </div>
            <div class="middle">
              <mat-chip-set>
                @for (ch of item.parsedChannels; track ch) {
                  <mat-chip [disableRipple]="true">{{ ch }}</mat-chip>
                }
              </mat-chip-set>
            </div>
            <app-status-badge [status]="item.overallStatus" type="message" />
          </div>
        </mat-list-item>
      }
    </mat-list>
  }
</mat-card>
